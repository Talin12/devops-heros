# Fixed version of session10-k8s-core-objects/k8s-core-objects/statefulset.yml
#
# Two changes from the original, both forced by running on an arm64 Mac:
#   1. mysql:5.7 -> mysql:8.0   (5.7 publishes no linux/arm64 image, so the pull
#                                fails with "no match for platform in manifest")
#   2. storage 5Gi -> 1Gi, replicas 3 -> 2  (keeps a single-node minikube honest)
#
# A StatefulSet also needs the headless Service named by serviceName, which the
# original manifest references but never defines. It is added here.
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  clusterIP: None          # headless -> per-pod DNS, no load-balancing VIP
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: "mysql"
  replicas: 2
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "password"
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
