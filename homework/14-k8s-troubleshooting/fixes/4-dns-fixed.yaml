# Fix part 1: the thing the client is trying to reach has to exist.
apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: "homework-only"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: production
spec:
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 5432
---
# Fix part 2: correct hostname, and stop hiding the failure behind "|| true".
apiVersion: v1
kind: Pod
metadata:
  name: fail-4-dns-failure-pod
  labels:
    tier: triage-gauntlet
    scenario: dns-failure
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "Attempting connection to internal database..."
          nc -zv -w 3 postgres-db.production.svc.cluster.local 5432 || exit 1
          echo "Process sleeping..."
          sleep 3600
